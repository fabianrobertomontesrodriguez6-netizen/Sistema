# Complemento de apache2.service (lo instala deploy/desplegar.sh en
# /etc/systemd/system/apache2.service.d/libretranslate.conf):
# al arrancar Apache (la web) también arranca LibreTranslate, el traductor de las consultas.
# Es "Wants" y no "Requires": si el traductor falla, la web sigue funcionando.
[Unit]
Wants=libretranslate.service
