# AutoPlaza en la red local (Apache + mod_php). Lo instala deploy/desplegar.sh
# en /etc/apache2/sites-available/sistema.conf.
<VirtualHost *:80>
    DocumentRoot /var/www/sistema/public

    <Directory /var/www/sistema/public>
        AllowOverride None
        Require all granted
        # Todo lo que no sea un archivo real lo atiende Symfony.
        FallbackResource /index.php
    </Directory>

    # Archivos de AssetMapper: llevan un hash en el nombre, se pueden guardar un año.
    <Directory /var/www/sistema/public/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Fotos y videos grandes desde el panel (PHP admite 2 MB por defecto).
    php_value upload_max_filesize 64M
    php_value post_max_size 70M

    ErrorLog ${APACHE_LOG_DIR}/sistema_error.log
    CustomLog ${APACHE_LOG_DIR}/sistema_access.log combined
</VirtualHost>
